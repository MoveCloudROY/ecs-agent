[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecs-agent"
version = "0.1.0"
description = "Entity-Component-System architecture for composable AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "MoveCloudROY", email = "MoveCloudROY@users.noreply.github.com" },
]
keywords = [
    "agent",
    "llm",
    "ecs",
    "entity-component-system",
    "ai",
    "openai",
    "anthropic",
    "multi-agent",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "structlog>=23.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "prometheus-client>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/MoveCloudROY/ecs-agent"
Repository = "https://github.com/MoveCloudROY/ecs-agent"
"Bug Tracker" = "https://github.com/MoveCloudROY/ecs-agent/issues"
Documentation = "https://github.com/MoveCloudROY/ecs-agent/tree/main/docs"
Changelog = "https://github.com/MoveCloudROY/ecs-agent/tree/main/docs/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
]
embeddings = ["numpy>=1.24.0"]
langfuse = ["langfuse>=3.0.0", "httpx[socks]>=0.24.0"]
mcp = ["mcp>=1.20.0"]
tokenizer = ["tiktoken>=0.7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ecs_agent"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "types-pyyaml>=6.0.12.20250915",
]
