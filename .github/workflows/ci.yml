name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: base
            extra-args: ""
          - dependencies: mcp
            extra-args: "--extra mcp"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev ${{ matrix.extra-args }}

      - name: Run pytest
        run: uv run --no-sync pytest --junitxml=.artifacts/pytest-${{ matrix.dependencies }}.xml

      - name: Upload offline test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.dependencies }}
          path: .artifacts/*.xml
          if-no-files-found: ignore
