name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches package versions
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.startswith("v"), f"Expected version tag, got: {tag}"
          tag_version = tag[1:]

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          pyproject_version = pyproject["project"]["version"]

          init_text = Path("src/ecs_agent/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if match is None:
              raise SystemExit("Could not find __version__ in src/ecs_agent/__init__.py")
          init_version = match.group(1)

          if tag_version != pyproject_version or tag_version != init_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, pyproject.toml={pyproject_version}, src/ecs_agent/__init__.py={init_version}"
              )
          PY

  test:
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --no-sync pytest

  live-tests:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: deepseek-responses
            required: tests/live/required-responses-core.json
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run required Responses core cases
        run: >-
          uv run --no-sync pytest --live
          --live-config tests/live/profiles.release.toml
          --llm-profile ${{ matrix.profile }}
          -m "live and (smoke or authoring) and not vision"
          --live-required ${{ matrix.required }}
          --live-report .artifacts/live-${{ matrix.profile }}.json
          --junitxml .artifacts/live-${{ matrix.profile }}.xml
          -v

      - name: Upload live test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.profile }}
          path: .artifacts/
          if-no-files-found: ignore

  build-and-release:
    runs-on: ubuntu-latest
    needs: live-tests
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release notes file
        run: |
          RELEASE_NOTES_PATH="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$RELEASE_NOTES_PATH"
          test -s "$RELEASE_NOTES_PATH"
          printf 'RELEASE_NOTES_PATH=%s\n' "$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Install build backend
        run: python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
